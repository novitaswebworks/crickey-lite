<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Versus</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="stage" class="center">
<div class="panel vs">
  <div class="teams">
    <div class="team"><span id="ba" class="badge"></span><div class="tn" id="na"></div></div>
    <div class="v">VS</div>
    <div class="team"><span id="bb" class="badge"></span><div class="tn" id="nb"></div></div>
  </div>
  <div class="foot"><div><b id="title"></b></div><div id="toss"></div><div id="venue"></div></div>
</div>
</div>
<script src="overlay-client.js?v=mockup1-20261105"></script>
<script>
Overlay.init({ name: 'versus', render: function (s, p, U) {
  U.colors(s, null);
  U.teamBadge(U.el('ba'), s.teams.A);
  U.teamBadge(U.el('bb'), s.teams.B);
  U.setText(U.el('na'), s.teams.A.name);
  U.setText(U.el('nb'), s.teams.B.name);
  U.setText(U.el('title'), s.title + (s.overs ? '  ·  ' + s.overs + ' overs' : ''));
  U.setText(U.el('toss'), s.toss ? s.toss.text : '');
  U.setText(U.el('venue'), s.venue);
} });
</script>
</body>
</html>
