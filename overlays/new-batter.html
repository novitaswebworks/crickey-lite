<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New batter</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="stage" class="mid">
<div class="panel sting nb">
  <div class="word">NEW<br>BATTER</div>
  <div class="info"><div class="big-name ell" id="name"></div><div class="sub" id="sub"></div><div class="sub" id="note"></div></div>
</div>
</div>
<script src="overlay-client.js"></script>
<script>
Overlay.init({ name: 'new-batter', transient: true,
  sample: function () { return { name: 'Batter Name', order: 4, team: 'TEAM', note: 'Career line goes here' }; },
  render: function (s, p, U) {
    var inn = U.currentInnings(s);
    if (inn) U.colors(s, inn);
    U.setText(U.el('name'), p ? p.name : '');
    U.setText(U.el('sub'), p && p.order ? 'Batting at No. ' + p.order : '');
    U.setText(U.el('note'), p ? p.note || '' : '');
  } });
</script>
</body>
</html>
