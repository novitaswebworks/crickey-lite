<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hockey Substitutes Bench</title>
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../components.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 0; overflow: hidden; background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
#stage { width: 100vw; height: 100vh; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 2.5rem; }
#stage.stage { opacity: 0; visibility: hidden; transition: opacity .4s ease, visibility 0s linear .4s; }
#stage.stage.on { opacity: 1; visibility: visible; transition-delay: 0s; }

/* Horizontal Subs Row */
.subs-container {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 1.5rem;
  margin-bottom: 2rem;
  z-index: 10;
  max-width: 95vw;
  flex-wrap: nowrap;
}

/* Individual Player Card */
.sub-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  transition: transform 0.3s ease;
}

.sub-img-wrap {
  width: 92px;
  height: 92px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  margin-bottom: -10px;
  z-index: 2;
  filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.7));
}

.sub-img {
  max-width: 92px;
  max-height: 92px;
  object-fit: contain;
}

.sub-silhouette {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1e3a8a, #3b82f6);
  border: 2px solid rgba(255, 255, 255, 0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 800;
  font-size: 1.4rem;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
}

/* Slanted Tag */
.sub-tag {
  display: flex;
  align-items: stretch;
  height: 28px;
  filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.5));
  transform: skewX(-14deg);
}

.sub-num {
  background: #ffffff;
  color: #d90429;
  font-weight: 900;
  font-size: 1rem;
  padding: 0 0.55rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-top-left-radius: 4px;
  border-bottom-left-radius: 4px;
}

.sub-name {
  background: linear-gradient(90deg, #0284c7 0%, #0369a1 100%);
  color: #ffffff;
  font-weight: 800;
  font-size: 0.9rem;
  letter-spacing: 0.02em;
  padding: 0 0.75rem;
  display: flex;
  align-items: center;
  white-space: nowrap;
  border-top-right-radius: 4px;
  border-bottom-right-radius: 4px;
}
.sub-tag * { transform: skewX(14deg); }

/* Bottom Bar */
.bottom-bar {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  z-index: 20;
}

.league-badge {
  background: #0f172a;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 6px;
  padding: 0.6rem 1.2rem;
  color: #ffffff;
  font-weight: 900;
  font-size: 1.1rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
}

.team-plate {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  border-left: 6px solid var(--team-color, #2563eb);
  border-right: 6px solid var(--team-color, #2563eb);
  padding: 0.5rem 3rem;
  border-radius: 8px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
  min-width: 440px;
}

.team-header {
  display: flex;
  align-items: center;
  gap: 0.8rem;
}

.team-name {
  font-size: 1.8rem;
  font-weight: 900;
  color: #ffffff;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.team-coach {
  font-size: 0.95rem;
  font-weight: 600;
  color: #94a3b8;
  letter-spacing: 0.03em;
  margin-top: 0.1rem;
}

.sponsor-badge {
  background: #0f172a;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 6px;
  padding: 0.6rem 1.2rem;
  color: #38bdf8;
  font-weight: 800;
  font-size: 1.1rem;
  letter-spacing: 0.05em;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
}
/* Bench is a single broadcast strip: substantial player tiles with a clear team rail. */
#stage { padding: 0 4vw 5vh; }
.subs-container { width: min(92vw, 1700px); max-width: none; gap: .65rem; margin-bottom: 1rem;
  align-items: stretch; padding: .9rem; background: linear-gradient(100deg,#071329ed,#10234bed);
  border-top: .2rem solid var(--team-color,#2563eb); border-bottom: .08rem solid #ffffff30;
  box-shadow: 0 1rem 2.2rem #0009; }
.subs-empty { width: 100%; padding: 1rem 1.25rem; color: #d6dfef; text-align: center; font-size: 1.15rem;
  font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
.sub-card { flex: 1 1 0; min-width: 0; padding: .6rem .25rem .7rem; background: #ffffff09;
  border-bottom: .16rem solid color-mix(in srgb,var(--team-color,#2563eb) 75%,white); }
.sub-img-wrap { width: 5.8rem; height: 5.8rem; margin: 0 0 .2rem; filter: drop-shadow(0 .4rem .5rem #0008); }
.sub-img { max-width: 5.8rem; max-height: 5.8rem; }
.sub-silhouette { width: 4.1rem; height: 4.1rem; font-size: 1rem; }
.sub-tag { height: auto; max-width: 100%; filter: none; transform: none; }
.sub-num { padding: .3rem .45rem; border-radius: .15rem 0 0 .15rem; font-size: 1rem; }
.sub-name { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; padding: .3rem .5rem;
  border-radius: 0 .15rem .15rem 0; font-size: .82rem; white-space: nowrap; }
.sub-tag * { transform: none; }
.bottom-bar { width: min(92vw,1700px); justify-content: space-between; gap: 1rem; }
.league-badge,.sponsor-badge { border: 0; border-radius: .2rem; padding: .8rem 1.3rem; background: #091633ef; font-size: 1.15rem; box-shadow: 0 .8rem 1.5rem #0007; }
.team-plate { flex: 1; min-width: 0; border: 0; border-top: .2rem solid var(--team-color,#2563eb); border-radius: .2rem; padding: .75rem 2rem;
  background: linear-gradient(100deg,#101d3c,#071329); box-shadow: 0 .8rem 1.5rem #0008; }
.team-name { font-size: 2.1rem; letter-spacing: .1em; }
.team-coach { font-size: 1.1rem; }
@media (max-width: 1200px) { .subs-container { gap: .25rem; padding: .5rem; } .sub-img-wrap { width: 4.5rem; height: 4.5rem; } .sub-img { max-width: 4.5rem; max-height: 4.5rem; } .sub-name { font-size: .7rem; } }
</style>
</head>
<body>
<div id="stage">
  <div class="subs-container" id="subsList"></div>

  <div class="bottom-bar">
    <div class="league-badge" id="tournament">FIH PRO LEAGUE</div>
    <div class="team-plate" id="teamPlate">
      <div class="team-header">
        <span id="teamBadge" class="badge"></span>
        <span class="team-name" id="teamName">INDIA</span>
      </div>
      <div class="team-coach" id="teamCoach">Coach: Graham Reid</div>
    </div>
    <div class="sponsor-badge" id="sponsor">polytan</div>
  </div>
</div>

<script src="../overlay-client.js?v=mockup1-20261105"></script>
<script>
function buildSubCard(p, teamColor) {
  var card = document.createElement('div');
  card.className = 'sub-card';

  var imgWrap = document.createElement('div');
  imgWrap.className = 'sub-img-wrap';

  if (p.photoPath) {
    var img = document.createElement('img');
    img.className = 'sub-img';
    img.src = p.photoPath;
    img.alt = p.name;
    imgWrap.appendChild(img);
  } else {
    var sil = document.createElement('div');
    sil.className = 'sub-silhouette';
    if (teamColor) sil.style.background = 'linear-gradient(135deg, ' + teamColor + ', #0f172a)';
    sil.textContent = p.shirtNo ? '#' + p.shirtNo : (p.shortName ? p.shortName.slice(0, 2) : p.name.slice(0, 2));
    imgWrap.appendChild(sil);
  }
  card.appendChild(imgWrap);

  var tag = document.createElement('div');
  tag.className = 'sub-tag';

  var num = document.createElement('div');
  num.className = 'sub-num';
  num.textContent = p.shirtNo || '-';
  tag.appendChild(num);

  var name = document.createElement('div');
  name.className = 'sub-name';
  if (teamColor) name.style.background = teamColor;
  var display = p.shortName || p.name;
  name.textContent = display + (p.isCaptain ? ' (C)' : '');
  tag.appendChild(name);

  card.appendChild(tag);
  return card;
}

Overlay.init({
  name: 'hockey/substitutes',
  // Team A and Team B can each have a browser source in the same OBS scene.
  // Only the source matching the side selected in the Control Room goes on air.
  isVisible: function (_state, payload, _entry, cfg) {
    var requestedSide = new URLSearchParams(window.location.search).get('side');
    return cfg.force || !requestedSide || !payload || !payload.side || payload.side === requestedSide;
  },
  sample: function () {
    return {
      matchId: 'sample',
      sport: 'hockey',
      tournament: 'FIH PRO LEAGUE',
      sponsor: 'polytan',
      side: 'A',
      teamName: 'India',
      teamColor: '#0055d4',
      coach: 'Graham Reid',
      substitutes: [
        { id: '21', name: 'R P. Singh', shirtNo: '3', role: 'DEF' },
        { id: '22', name: 'J. Singh', shirtNo: '4', role: 'MID' },
        { id: '23', name: 'H. Singh', shirtNo: '8', role: 'MID' },
        { id: '24', name: 'K. Pathak', shirtNo: '12', role: 'GK' },
        { id: '25', name: 'N. Sharma', shirtNo: '18', role: 'FWD' },
        { id: '26', name: 'R. Singh', shirtNo: '31', role: 'DEF' },
        { id: '27', name: 'G. Singh', shirtNo: '71', role: 'FWD' }
      ]
    };
  },
  render: function (s, p, U) {
    if (!s) return;
    U.empty(false);

    var urlParams = new URLSearchParams(window.location.search);
    // Keep Team A and Team B browser sources independent even though they share
    // the same server-side overlay visibility and trigger payload.
    var requestedSide = urlParams.get('side');
    var side = requestedSide === 'A' || requestedSide === 'B'
      ? requestedSide
      : ((p && p.side === 'B') || (s && s.side === 'B') ? 'B' : 'A');
    var team = s.teams ? s.teams[side] : null;

    var teamName = (team && team.name) || (p && p.teamName) || 'Team ' + side;
    var teamColor = (team && team.color) || (p && p.teamColor) || '#0055d4';
    var coach = (team && team.coach) || (p && p.coach) || '';
    var tournament = (p && p.tournament) || s.tournament || 'FIH PRO LEAGUE';
    var sponsor = (p && p.sponsor) || s.sponsor || 'polytan';

    document.documentElement.style.setProperty('--team-color', teamColor);

    U.setText(U.el('tournament'), tournament);
    U.setText(U.el('teamName'), teamName);
    U.setText(U.el('teamCoach'), coach ? 'Coach: ' + coach : '');
    U.el('teamCoach').style.display = coach ? 'block' : 'none';
    U.setText(U.el('sponsor'), sponsor);
    if (team) U.teamBadge(U.el('teamBadge'), team);

    var subs = team && team.substitutes
      ? team.substitutes
      : ((p && p.substitutes) || []);
    var container = U.el('subsList');
    container.innerHTML = '';
    if (!subs.length) {
      var empty = document.createElement('div');
      empty.className = 'subs-empty';
      empty.textContent = 'No substitutes listed';
      container.appendChild(empty);
    }
    for (var i = 0; i < subs.length; i++) {
      container.appendChild(buildSubCard(subs[i], teamColor));
    }
  }
});
</script>
</body>
</html>
